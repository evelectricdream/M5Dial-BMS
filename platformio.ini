; =============================================================================
; M5DialBMS v7 - PlatformIO Configuration
;
; Library versions pinned to match the verified local working set.
;
; lib/ folder (vendored M5GFX/M5Unified) is no longer needed and can be
; deleted from the repo.
; =============================================================================

[env:m5dial]
platform  = espressif32 @ 6.10.0
framework = arduino
board     = esp32-s3-devkitc-1

; ---- Flash layout ----
board_build.partitions  = default_8MB.csv
board_build.flash_size  = 8MB
board_build.flash_mode  = dio
board_build.flash_freq  = 80m
board_build.f_cpu       = 240000000L

; ---- Build flags ----
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_SKIP=0
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BAR=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_COLOR_DEPTH=16

; ---- Upload & monitor ----
upload_protocol = esp-builtin
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize, time

; ---- Libraries ----
; Pinned to locally verified versions.
lib_deps =
    m5stack/M5Unified                    @ 0.2.21
    m5stack/M5GFX                        @ 0.2.28
    lvgl/lvgl                            @ =8.4.0
    esphome/AsyncTCP-esphome             @ 2.1.4
    esphome/ESPAsyncWebServer-esphome    @ 3.4.0
    bblanchon/ArduinoJson                @ 7.4.3

lib_ldf_mode = deep+
